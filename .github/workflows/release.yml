name: Build draft release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild as a draft
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          package_version="$(node -p "require('./package.json').version")"
          [[ "$tag" == "v$package_version" ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    needs: release-info
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-info.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize macOS packages
        run: npm run build:mac

      - name: Verify signatures and notarization tickets
        run: |
          set -euo pipefail
          for app in release/mac*/Transgentic.app; do
            codesign --verify --deep --strict --verbose=4 "$app"
            test "$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^Identifier=//p')" = "one.transgentic.desktop"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done

      - name: Stage macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/Transgentic-*.dmg
            release/Transgentic-*-mac.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: release-info
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-info.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run build:win

      - name: Stage Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*-win.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: release-info
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-info.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run build:linux

      - name: Stage Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: [release-info, macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
    steps:
      - name: Collect release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update draft release
        run: |
          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [[ "$release_is_draft" == "true" ]]
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
